# GitHub Actions: собирает готовый APK автоматически в облаке
name: Build Licey RP APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Установить зависимости
        run: npm install

      - name: Создать Android-проект
        run: npx cap add android

      - name: Скопировать игру в проект
        run: npx cap sync

      - name: Собрать debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Готовый APK для скачивания
        uses: actions/upload-artifact@v4
        with:
          name: licey-rp-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
