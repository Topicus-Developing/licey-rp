<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<title>Licey RP 3D</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; font-family:'Segoe UI',Arial,sans-serif; }
  #scene { display:block; touch-action:none; }

  #titleScreen {
    position:fixed; inset:0; z-index:100;
    background:linear-gradient(160deg,#1a1a2e 0%,#16213e 60%,#0f3460 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; color:#fff; padding:20px;
  }
  #titleScreen h1 {
    font-size:52px; letter-spacing:6px; font-weight:900;
    background:linear-gradient(90deg,#ffd700,#ff8c00);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 4px 20px rgba(255,140,0,.35);
  }
  #titleScreen h2 { font-size:15px; letter-spacing:8px; color:#8ab4f8; margin:4px 0 28px; }
  .btn {
    background:linear-gradient(90deg,#e94560,#c73659); color:#fff; border:none;
    padding:16px 60px; font-size:22px; font-weight:700; letter-spacing:2px;
    border-radius:14px; cursor:pointer; box-shadow:0 6px 18px rgba(233,69,96,.45);
  }
  .btn:active { transform:scale(.96); }
  #nickInput {
    margin-bottom:18px; padding:12px 16px; font-size:18px; border-radius:10px;
    border:2px solid #3a3a5e; background:#21213a; color:#fff; width:260px; text-align:center;
  }
  .hint { margin-top:22px; color:#888; font-size:13px; max-width:360px; line-height:1.5; }

  #hud { position:fixed; top:10px; left:10px; z-index:50; color:#fff; display:none; pointer-events:none; }
  .hud-box {
    background:rgba(0,0,0,.55); border-radius:8px; padding:6px 12px;
    margin-bottom:6px; font-size:15px; border-left:3px solid #ffd700;
  }
  #hpBar { width:140px; height:10px; background:#333; border-radius:5px; margin-top:4px; overflow:hidden; }
  #hpFill { height:100%; width:100%; background:linear-gradient(90deg,#2ecc71,#27ae60); border-radius:5px; }

  #joystick {
    position:fixed; bottom:34px; left:26px; width:140px; height:140px;
    border-radius:50%; background:rgba(255,255,255,.08);
    border:2px solid rgba(255,255,255,.25); z-index:60; display:none; touch-action:none;
  }
  #stick {
    position:absolute; left:50%; top:50%; width:58px; height:58px;
    border-radius:50%; background:rgba(255,255,255,.4);
    transform:translate(-50%,-50%); border:2px solid rgba(255,255,255,.6);
  }

  #actionBtn {
    position:fixed; bottom:60px; right:26px; width:92px; height:92px;
    border-radius:50%; background:rgba(255,215,0,.9); color:#222;
    border:none; font-size:16px; font-weight:900; z-index:60; display:none;
    box-shadow:0 4px 14px rgba(255,215,0,.4); touch-action:manipulation;
  }

  #hintBox {
    position:fixed; top:18%; left:50%; transform:translateX(-50%);
    z-index:55; display:none; background:rgba(0,0,0,.65); color:#ffd700;
    padding:10px 18px; border-radius:10px; font-size:16px; font-weight:700;
    border:1px solid rgba(255,215,0,.5); text-align:center; pointer-events:none;
  }

  #chatlog {
    position:fixed; bottom:8px; left:50%; transform:translateX(-50%);
    width:min(92vw,520px); z-index:40; pointer-events:none; display:none;
  }
  .chat-msg {
    background:rgba(0,0,0,.6); color:#eee; border-radius:8px;
    padding:5px 10px; margin-top:4px; font-size:14px; opacity:0;
    animation:fadein .25s forwards;
  }
  @keyframes fadein { to { opacity:1; } }
  .sys { color:#ffd700; }
  .npc-msg { color:#8ab4f8; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>
<body>

<div id="titleScreen">
  <h1>LICEY RP</h1>
  <h2>3D • ОТКРЫТЫЙ ГОРОД</h2>
  <input id="nickInput" placeholder="Введи никнейм" maxlength="14" value="Игрок">
  <button class="btn" id="playBtn">ИГРАТЬ</button>
  <p class="hint">
    🎮 Левый нижний угол — джойстик для бега<br>
    📷 Правая часть экрана — поворот камеры (проводи пальцем)<br>
    ⌨️ На ПК: WASD — движение, зажми ЛКМ и веди мышку — камера, E — действие
  </p>
</div>

<div id="hud">
  <div class="hud-box" id="nickBox">Игрок | Уровень 1</div>
  <div class="hud-box">💰 <span id="money">250</span> ₽</div>
  <div class="hud-box">🎒 Работа: <span id="job">Безработный</span></div>
  <div class="hud-box">Здоровье<div id="hpBar"><div id="hpFill"></div></div></div>
</div>

<div id="hintBox"></div>
<div id="joystick"><div id="stick"></div></div>
<button id="actionBtn">ДЕЙСТВ.</button>
<div id="chatlog"></div>
<canvas id="scene"></canvas>

<script type="module" src="game.js"></script>
</body>
</html>
